version: '3.8'

services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "8080:8080"  # Убираем внешний доступ, доступ только через nginx
    networks:
      - game-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./src/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - game-server
    networks:
      - game-network
    # restart: unless-stopped

networks:
  game-network:
    driver: bridge
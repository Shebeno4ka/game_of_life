<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life - WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #989898;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        canvas {
            border: 2px solid #333;
            display: block;
            margin: 20px auto;
            background-color: rgb(0, 0, 0);
            cursor: crosshair;
        }
        #status {
            text-align: center;
            margin: 10px;
            font-size: 16px;
            padding: 10px;
            border-radius: 5px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info {
            text-align: center;
            margin: 10px;
            color: #666;
        }
    </style>
</head>
<body>
<h1>Game of Life</h1>
<div id="status" class="disconnected">Connecting to WebSocket...</div>
<canvas id="gameCanvas"></canvas>

<script>
    // Game of Life WebSocket Client with comprehensive logging
    // All WebSocket operations and user interactions are logged to console
    // Open browser developer tools (F12) to see the logs
    
    // Game configuration
    const GRID_SIZE = 10;

    // Calculate canvas size based on window size
    function calculateCanvasSize() {
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        // Leave some margin for UI elements (header, status, etc.)
        const availableWidth = windowWidth - 50;
        const availableHeight = windowHeight - 100;

        // Use the smaller dimension to keep it square
        const size = Math.min(availableWidth, availableHeight, 800); // Max 800px
        return Math.max(size, 300); // Min 300px
    }

    let CANVAS_SIZE = calculateCanvasSize();
    let CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

    // Get canvas and context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusElement = document.getElementById('status');

    // Set canvas size
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;

    // Game state - 100x100 grid
    let gameState = new Array(GRID_SIZE * GRID_SIZE).fill(0);

    // Track hovered cell
    let hoveredCell = { x: -1, y: -1 };

    // WebSocket connection - через nginx прокси
    const socket = new WebSocket("ws://127.0.0.1:8080");

    // Connection opened
    socket.addEventListener('open', (event) => {
        console.log('WebSocket connection opened:', event);
        statusElement.textContent = 'Connected to WebSocket';
        statusElement.className = 'connected';
    });

    // Connection closed
    socket.addEventListener('close', (event) => {
        console.log('WebSocket connection closed:', event);
        statusElement.textContent = 'Disconnected from WebSocket';
        statusElement.className = 'disconnected';
    });

    // Connection error
    socket.addEventListener('error', (event) => {
        console.error('WebSocket error:', event);
    });

    // Listen for messages - expecting array of 1250 байт
socket.addEventListener('message', (event) => {
    console.log('Received WebSocket message:', event);
    
    if (event.data instanceof Blob) {
        console.log('Received Blob data, size:', event.data.size, 'bytes');
        
        // Читаем Blob как ArrayBuffer
        event.data.arrayBuffer().then(buffer => {
            const compressedData = new Uint8Array(buffer);
            console.log('Processed ArrayBuffer, length:', compressedData.length, 'bytes');
            console.log('First 10 bytes:', Array.from(compressedData.slice(0, 10)));
            
            // Ожидаем 1250 байт для поля 100x100 (8 ячеек на байт)
            if (compressedData.length === GRID_SIZE * GRID_SIZE / 8) {
                console.log('Processing compressed game state data...');
                
                // Распаковываем сжатые данные
                for (let byteIndex = 0; byteIndex < compressedData.length; byteIndex++) {
                    const byte = compressedData[byteIndex];
                    
                    // Извлекаем 8 бит из каждого байта
                    for (let bitIndex = 0; bitIndex < 8; bitIndex++) {
                        const cellIndex = byteIndex * 8 + bitIndex;
                        
                        // Проверяем, что не выходим за границы массива
                        if (cellIndex < gameState.length) {
                            // Извлекаем бит (начиная с младшего)
                            gameState[cellIndex] = (byte >> bitIndex) & 1;
                        }
                    }
                }
                
                // Подсчитываем количество живых клеток для логирования
                const aliveCells = gameState.filter(cell => cell > 0).length;
                console.log('Game state updated. Alive cells:', aliveCells, '/', gameState.length);
                
                // Перерисовываем поле после получения новых данных
                drawGrid();
            } else {
                console.warn('Unexpected data length:', compressedData.length, 'Expected:', GRID_SIZE * GRID_SIZE / 8);
            }
        });
    } else {
        console.log('Received non-Blob data:', event.data);
    }
});
    // Draw the grid
    function drawGrid() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        for (let x = 0; x < GRID_SIZE; x++) {
            for (let y = 0; y < GRID_SIZE; y++) {
                const index = y * GRID_SIZE + x;
                const isAlive = gameState[index] > 0;
                // Проверка, является ли клетка активированной (выбранной пользователем)
                const isActivated = activatedCells.some(cell => cell.x === x && cell.y === y);

                // Draw cell: желтым, если активирована, белым, если живая, черным иначе
                if (isActivated) {
                    ctx.fillStyle = '#ffff00'; // Желтый цвет для активированных клеток
                } else {
                    ctx.fillStyle = isAlive ? '#ffffff' : '#000000';
                }
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Draw grid lines (red if hovered, gray otherwise)
                if (hoveredCell.x === x && hoveredCell.y === y) {
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                } else {
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 0.2;
                }
                ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }
    }

    // Массив для хранения координат активированных клеток
    let activatedCells = [];

    // Handle mouse clicks
    canvas.addEventListener('click', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((event.clientX - rect.left) / CELL_SIZE);
        const y = Math.floor((event.clientY - rect.top) / CELL_SIZE);

        console.log('Cell clicked at coordinates:', { x, y });

        // Добавляем координаты в массив, если их там еще нет
        if (!activatedCells.some(cell => cell.x === x && cell.y === y)) {
            activatedCells.push({ x, y });
            console.log('Cell activated. Total activated cells:', activatedCells.length);
        } else {
            // Удаляем координаты, если они уже есть
            activatedCells = activatedCells.filter(cell => !(cell.x === x && cell.y === y));
            console.log('Cell deactivated. Total activated cells:', activatedCells.length);
        }
        
        console.log('Current activated cells:', activatedCells);
    });

    // Отправка накопленных координат по нажатию пробела
    window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && activatedCells.length > 0 && socket.readyState === WebSocket.OPEN) {
            console.log('Sending activated cells:', activatedCells);
            console.log('Number of cells to send:', activatedCells.length);
            
            // Создаем буфер для всех координат (каждая пара x, y — по 4 байта на число)
            const buffer = new ArrayBuffer(activatedCells.length * 8);
            const view = new Uint32Array(buffer);
            activatedCells.forEach((cell, i) => {
                view[i * 2] = cell.x;
                view[i * 2 + 1] = cell.y;
            });
            
            console.log('Sending ArrayBuffer, size:', buffer.byteLength, 'bytes');
            console.log('Buffer content (first 20 values):', Array.from(view.slice(0, 20)));
            
            socket.send(buffer);
            
            console.log('Data sent successfully, clearing activated cells');
            activatedCells = [];
        } else if (event.code === 'Space' && activatedCells.length === 0) {
            console.log('Space pressed but no activated cells to send');
        } else if (event.code === 'Space' && socket.readyState !== WebSocket.OPEN) {
            console.warn('Space pressed but WebSocket is not connected, state:', socket.readyState);
        }
    });

    // Handle mouse movement for hover effect
    canvas.addEventListener('mousemove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((event.clientX - rect.left) / CELL_SIZE);
        const y = Math.floor((event.clientY - rect.top) / CELL_SIZE);

        // Update hovered cell if it changed
        if (hoveredCell.x !== x || hoveredCell.y !== y) {
            hoveredCell.x = x;
            hoveredCell.y = y;
            drawGrid();
        }
    });

    // Clear hover effect when mouse leaves canvas
    canvas.addEventListener('mouseleave', () => {
        if (hoveredCell.x !== -1 || hoveredCell.y !== -1) {
            hoveredCell.x = -1;
            hoveredCell.y = -1;
            drawGrid();
        }
    });

    // Initial draw
    drawGrid();

    // Handle window resize
    window.addEventListener('resize', () => {
        CANVAS_SIZE = calculateCanvasSize();
        CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        drawGrid();
    });
</script>
</body>
</html>
